
name: Build FeatherFPS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'FeatherFPS-by-Meadow-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/FeatherFPS-by-Meadow-Source.zip"
          test -f "$ZIP" || { echo "Source ZIP missing"; exit 1; }
          unzip -t "$ZIP"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and locate project
        id: project
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/featherfps-source"
          mkdir -p "$DEST"
          unzip -oq "$GITHUB_WORKSPACE/FeatherFPS-by-Meadow-Source.zip" -d "$DEST"
          SETTINGS="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo "No Gradle settings file found in ZIP"
            find "$DEST" -maxdepth 5 -type f
            exit 1
          fi
          DIR="$(dirname "$SETTINGS")"
          if [[ ! -f "$DIR/app/build.gradle" && ! -f "$DIR/app/build.gradle.kts" ]]; then
            echo "Android app Gradle file not found"
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          set -euo pipefail
          DIR="${{ steps.project.outputs.dir }}"
          if [[ -f "$DIR/gradlew" ]]; then
            chmod +x "$DIR/gradlew"
            "$DIR/gradlew" --no-daemon --stacktrace -p "$DIR" :app:assembleDebug
          else
            gradle --no-daemon --stacktrace -p "$DIR" :app:assembleDebug
          fi

      - name: Prepare APK
        run: |
          set -euo pipefail
          DIR="${{ steps.project.outputs.dir }}"
          APK="$(find "$DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "No APK was generated"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/FeatherFPS-by-Meadow-debug.apk
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeatherFPS-by-Meadow-APK
          path: artifacts/FeatherFPS-by-Meadow-debug.apk
          if-no-files-found: error
          retention-days: 14
          
